name: Update Release Notes
on:
  push:
    branches: [master]
    paths: ['.github/workflows/update-release.yml']
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update v12.0.0 release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v12.0.0 --notes "## Download v12.0.0

          | Platform | File | Download |
          |----------|------|----------|
          | **Windows (Installer)** | DarkNite-Installer-12.0.0.exe | [Download for Windows](https://github.com/dfnine9/darknite/releases/download/v12.0.0/DarkNite-Installer-12.0.0.exe) |
          | **Windows (Portable)** | DarkNite-12.0.0.exe | [Download for Windows](https://github.com/dfnine9/darknite/releases/download/v12.0.0/DarkNite-12.0.0.exe) |
          | **macOS (Intel + Apple Silicon)** | DarkNite-12.0.0-mac.zip | [Download for Mac](https://github.com/dfnine9/darknite/releases/download/v12.0.0/DarkNite-12.0.0-mac.zip) |

          > **macOS users:** After downloading, unzip and drag DarkNite to Applications. If macOS blocks it, go to **System Settings > Privacy & Security** and click **Open Anyway**.

          ---

          ## What's New

          ### macOS Fix: Skills Now Load Reliably
          - **Problem:** On macOS, skills/agents/commands would not show up
          - **Root cause:** 52MB inline base64 in index.html caused the app to choke on Mac
          - **Fix:** Data now loads via IPC from the main process — fast and reliable on all platforms
          - index.html reduced from 52MB to 268KB

          ### Full Changelog
          - Added \`load-data\` IPC handler in main.js (reads data.b64 from disk via Node.js Buffer)
          - Added \`loadData()\` in preload.js
          - Async data loading on page init in index.html
          - Added \`asarUnpack\` for data.b64 in packaged builds"
